<!DOCTYPE html>
<html>
  <head>
    <META http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <script data-selector=".playground-code" src="https://unpkg.com/kotlin-playground@1"></script>

    <style>
			.CodeMirror { font-size: 20px; line-height: 25px; }
			.code-output { font-size: 20px; line-height: 25px; }
			
		</style>
    
  </head>
  <body>
    <code class="playground-code" data-autocomplete="true" folded-button="false" lines="true" match-brackets="true" mode="c" theme="darcula">
#include &lt;stdio.h&gt;
#include &lt;string.h&gt;
#include "funcs.h"

void strings2() {
    char *str = "Hello";
    printf("str address = %p\n", str);
    printf("str = %s\n", str);

    for (int i = 0; str[i] != '\0'; i++)
        printf("char %d = %c and %c\n", i, str[i], *(str + i));

    printf("strlen(str) = %ld\n", strlen(str));
}
</code>
  </body>
</html>
