<!DOCTYPE html>
<html>
  <head>
    <META http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <script data-selector=".playground-code" src="https://unpkg.com/kotlin-playground@1"></script>

    <style>
			.CodeMirror { font-size: 20px; line-height: 25px; }
			.code-output { font-size: 20px; line-height: 25px; }
			
		</style>
    
  </head>
  <body>
    <code class="playground-code" data-autocomplete="true" folded-button="false" lines="true" match-brackets="true" theme="darcula">
package lambdas

fun main() {
  //sampleStart

  val doubleToString: (Int) -&gt; String = { it.toString() + it.toString() }

  val doubleToInt: (Int) -&gt; Int = { it + it }

  println(doubleToString(10))
  println(doubleToInt(11))
  //sampleEnd
}
</code>
  </body>
</html>
